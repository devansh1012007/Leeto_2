[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bhctf-backend"
version = "1.0.0"
description = "Bug Hunt CTF backend monorepo packages"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "pyjwt[crypto]>=2.9",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "testcontainers[postgres]>=4.8",
]

[tool.setuptools.packages.find]
where = ["packages"]
include = ["*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends-in-default is the framework idiom

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
markers = [
  "boundaries: forbidden-import checks (CI)",
  "integration: requires Postgres",
]
