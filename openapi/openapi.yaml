components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token (audience: participant or admin per API)'
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Secure-refresh
      description: HttpOnly refresh cookie, Path=/v1/auth
    runnerToken:
      type: http
      scheme: bearer
      description: Signed per-runner token; can only claim and report
  schemas:
    Meta:
      type: object
      required:
      - request_id
      - server_time
      properties:
        request_id:
          type: string
          description: Correlation id
          example: req_01J8ZK3M2P
        server_time:
          type: string
          format: date-time
          description: Authoritative server time (UTC)
          example: '2026-12-05T09:41:12.401Z'
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
              description: Stable error code from openapi/errors.yaml
            message:
              type: string
              description: Human-readable, safe to display (copy-catalog key resolved)
            details:
              type: object
              description: Structured details per error code (e.g. waiting_on[], repo_choice, conflict)
            request_id:
              type: string
          additionalProperties: false
      additionalProperties: false
    StageBrief:
      type: object
      required:
      - stage_key
      - ordinal
      - name
      - kind
      - state
      - submitted
      properties:
        stage_key:
          type: string
          pattern: ^[a-z0-9_]{3,32}$
          description: Stable slug identity (R-18)
          example: level_2_flags
        ordinal:
          type: integer
          description: Informational order only
        name:
          type: string
        kind:
          type: string
          enum:
          - explain_only
          - flags
          - upload
        explain_opens_at:
          type: string
          format: date-time
          nullable: true
        exec_opens_at:
          type: string
          format: date-time
          nullable: true
        exec_closes_at:
          type: string
          format: date-time
          nullable: true
        state:
          type: string
          enum:
          - locked
          - open
          - closed
        paused:
          type: boolean
        submitted:
          type: boolean
        gate:
          type: object
          properties:
            allowed:
              type: boolean
            waiting_on:
              type: array
              items:
                type: string
      additionalProperties: false
    State:
      type: object
      description: state_shape_v1 (frozen, additive-only; see docs/CONTRACTS.md). ETag = sha256 of version tuple;
        server_time excluded from the ETag body.
      required:
      - server_time
      - event
      - me
      - node_pointer
      - stages
      - team
      - versions
      - announcements
      - feature_flags
      properties:
        server_time:
          type: string
          format: date-time
          description: Always fresh; NOT part of the ETag body
        event:
          type: object
          required:
          - id
          - status
          - paused
          - tz
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum:
              - draft
              - published
              - live
              - ended
              - archived
            paused:
              type: boolean
            tz:
              type: string
              example: Asia/Kolkata
            maintenance:
              type: boolean
            safe_mode:
              type: boolean
              description: Safe Mode master switch (08 §4.10)
        me:
          type: object
          required:
          - participant_id
          - role
          - consent_required
          properties:
            participant_id:
              type: string
              format: uuid
            team_id:
              type: string
              format: uuid
              nullable: true
            role:
              type: string
            consent_required:
              type: boolean
            min_client_version:
              type: string
              example: 1.2.0
        node_pointer:
          type: object
          required:
          - node
          - sub_state
          - version
          properties:
            node:
              type: string
              enum:
              - LANDING
              - L1_EXPLAIN
              - L1_EXEC
              - L1_SUBMITTED
              - L2_EXPLAIN
              - L2_EXEC
              - L2_SUBMITTED
              - L3_EXPLAIN
              - L3_EXEC
              - L3_SUBMITTED
              - L4_EXPLAIN
              - L4_EXEC
              - L4_SUBMITTED
              - DONE
            sub_state:
              type: string
              enum:
              - waiting_repo_lock
              - ready
              - active
              - submitting
              - evaluating
              - evaluated
              - adjusted
              description: B11 sub-states
            version:
              type: integer
            adjusted_by:
              type: string
              format: uuid
              nullable: true
              description: Set when an organizer force-advanced (R-23)
        stages:
          type: array
          items:
            $ref: '#/components/schemas/StageBrief'
        team:
          type: object
          required:
          - score
          - score_version
          - repo_choice
          properties:
            score:
              type: number
            score_version:
              type: integer
            repo_choice:
              type: string
              nullable: true
        versions:
          type: object
          required:
          - progress_version
          - score_version
          - leaderboard_version
          - flags_version
          - announcement_version
          properties:
            progress_version:
              type: integer
            score_version:
              type: integer
            leaderboard_version:
              type: integer
            flags_version:
              type: integer
            announcement_version:
              type: integer
        announcements:
          type: array
          description: Latest 5; full list via GET /announcements
          items:
            type: object
            required:
            - id
            - severity
            - body_md
            - created_at
            properties:
              id:
                type: string
                format: uuid
              severity:
                type: string
                enum:
                - info
                - warn
                - critical
              body_md:
                type: string
              created_at:
                type: string
                format: date-time
        feature_flags:
          type: object
          required:
          - leaderboard
          - runner
          - ai
          - uploads
          - announcements
          - practice
          - read_only
          properties:
            leaderboard:
              type: boolean
            runner:
              type: boolean
            ai:
              type: boolean
            uploads:
              type: boolean
            announcements:
              type: boolean
            practice:
              type: boolean
            read_only:
              type: boolean
      additionalProperties: false
    FlagInput:
      type: object
      required:
      - file
      - lines
      - explanation
      properties:
        file:
          type: string
          description: Path within the team's repo option
          example: src/auth/session.py
        lines:
          type: string
          description: Line range like '41-47' or '41'
          example: 41-47
        explanation:
          type: string
          maxLength: 2000
          description: Why this is a defect
        related:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              file:
                type: string
              lines:
                type: string
        category:
          type: string
        runnable_ref:
          type: string
          description: Optional reference to scratch files for official runs
    SubmitRequest:
      description: Discriminated union by kind (flags for levels 1-2, upload for levels 3-4).
      oneOf:
      - type: object
        required:
        - kind
        - flags
        properties:
          kind:
            type: string
            enum:
            - flags
          flags:
            type: array
            minItems: 1
            maxItems: 80
            items:
              $ref: '#/components/schemas/FlagInput'
      - type: object
        required:
        - kind
        - upload_id
        properties:
          kind:
            type: string
            enum:
            - upload
          upload_id:
            type: string
            format: uuid
            description: Must have status=ok (or validation=deferred per B9)
    SubmitAccepted:
      type: object
      required:
      - receipt_id
      - accepted_at
      properties:
        receipt_id:
          type: string
          description: Short receipt code (HMAC-derived)
          example: K7QD-92MX
        accepted_at:
          type: string
          format: date-time
          description: clock_timestamp() captured after the stage-state lock (B6)
        status:
          type: string
          enum:
          - received
    RunRequest:
      type: object
      required:
      - stage_key
      - command_id
      - workspace
      properties:
        stage_key:
          type: string
          pattern: ^[a-z0-9_]{3,32}$
        command_id:
          type: string
          pattern: ^[a-z][a-z0-9_]{2,32}$
          description: Must be in the stage's run_commands allow-list; fixed argv lives server-side (R-08/B9)
          example: test
        workspace:
          description: Server draft reference, or a small inline delta
          oneOf:
          - type: object
            required:
            - draft_version
            properties:
              draft_version:
                type: integer
          - type: object
            required:
            - delta
            properties:
              delta:
                type: string
                maxLength: 262144
                description: ≤ 256 KB inline delta
        stdin:
          type: string
          maxLength: 65536
          description: Optional base64 stdin
        practice:
          type: boolean
          default: false
          description: Practice namespace; hidden inputs unreachable (06 §5)
    RunState:
      type: object
      required:
      - id
      - state
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - queued
          - running
          - finished
          - timed_out
          - killed
          - failed
        stdout_b64:
          type: string
          description: Capped; truncated flag set when over MAX_OUTPUT_BYTES
        stderr_b64:
          type: string
        exit_code:
          type: integer
          nullable: true
        truncated:
          type: boolean
        queue_position:
          type: integer
          description: Present while queued (admission control, 02 §10.5)
    Upload:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - stored
          - validating
          - ok
          - failed
          description: stored → validating → ok | failed (frozen lifecycle)
        sha256:
          type: string
        size:
          type: integer
        problems:
          type: array
          items:
            type: string
          description: Present when failed (validation ran on the runner, never the API host)
    DraftPut:
      type: object
      required:
      - payload
      properties:
        payload:
          type: object
          description: Workspace state; ≤ 512 KB serialized (else 413 DRAFT_TOO_LARGE)
