openapi: 3.1.0
info:
  title: Bug Hunt CTF API
  version: 1.0.0
  description: Frozen contract for participant + admin APIs (state_shape_v1 in docs/CONTRACTS.md). State conflicts
    are 409 (R-06); no locked status codes are used anywhere.
servers:
- url: /
- url: https://api.example.com/v1
  description: prod (Tunnel)
tags:
- name: auth
- name: consent
- name: public
- name: state
- name: team
- name: repo
- name: stages
- name: drafts
- name: submit
- name: uploads
- name: runs
- name: receipts
- name: practice
- name: ops
- name: admin-auth
- name: admin-events
- name: admin-live
- name: admin-preview
- name: admin-ch
- name: admin-gt
- name: admin-aa
- name: admin-rescore
- name: admin-review
- name: admin-emergency
- name: admin-incidents
- name: admin-system
- name: runner
paths:
  /v1/auth/login:
    post:
      summary: Sign in
      description: Sign in
      tags:
      - auth
      operationId: post__v1_auth_login
      responses:
        '200':
          description: Signed in; sets __Secure-refresh cookie
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      expires_at:
                        type: string
                        format: date-time
                additionalProperties: false
        '401':
          description: 'Errors: AUTH_INVALID_CREDENTIALS'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Errors: AUTH_RATE_LIMITED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '426':
          description: 'Errors: CLIENT_TOO_OLD'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: 'Errors: PAYLOAD_TOO_LARGE'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'Errors: VALIDATION_ERROR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: 'Errors: INTERNAL'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - identifier
              - password
              properties:
                identifier:
                  type: string
                  description: email or username
                password:
                  type: string
                  format: password
  /v1/auth/refresh:
    post:
      summary: Rotate refresh token
      description: Rotate refresh token
      tags:
      - auth
      operationId: post__v1_auth_refresh
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                additionalProperties: false
        '401':
          description: 'Errors: AUTH_SESSION_EXPIRED, AUTH_SESSION_SUPERSEDED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'Errors: AUTH_FORBIDDEN'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Errors: AUTH_RATE_LIMITED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /v1/auth/logout:
    post:
      summary: Revoke session
      description: Revoke session
      tags:
      - auth
      operationId: post__v1_auth_logout
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                additionalProperties: false
        '401':
          description: 'Errors: AUTH_TOKEN_EXPIRED, AUTH_SESSION_EXPIRED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: &id001
      - bearerAuth: []
  /v1/auth/activate:
    post:
      summary: Activate account via invite
      description: Activate account via invite
      tags:
      - auth
      operationId: post__v1_auth_activate
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                additionalProperties: false
        '404':
          description: 'Errors: NOT_FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'Errors: VALIDATION_ERROR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 'Errors: IDEMPOTENCY_CONFLICT'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 12
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Replay with the same key + payload hash returns the original response, even after the deadline
          (B4).
  /v1/auth/reset/request:
    post:
      summary: Request password reset (always generic)
      description: Request password reset (always generic)
      tags:
      - auth
      operationId: post__v1_auth_reset_request
      responses:
        '200':
          description: Generic confirmation
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                additionalProperties: false
        '429':
          description: 'Errors: AUTH_RATE_LIMITED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'Errors: VALIDATION_ERROR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Replay with the same key + payload hash returns the original response, even after the deadline
          (B4).
  /v1/auth/reset/confirm:
    post:
      summary: Confirm reset
      description: Confirm reset
      tags:
      - auth
      operationId: post__v1_auth_reset_confirm
      responses:
        '200':
          description: Password set; sessions revoked
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                additionalProperties: false
        '404':
          description: 'Errors: NOT_FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'Errors: VALIDATION_ERROR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 12
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Replay with the same key + payload hash returns the original response, even after the deadline
          (B4).
  /v1/me:
    get:
      summary: Profile, roles, consent state
      description: Profile, roles, consent state
      tags:
      - auth
      operationId: get__v1_me
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: object
                additionalProperties: false
        '401':
          description: 'Errors: AUTH_TOKEN_EXPIRED, AUTH_SESSION_EXPIRED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'Errors: AUTH_CONSENT_REQUIRED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: *id001
  /v1/consent:
    get:
      summary: Consent versions and state
      description: Consent versions and state
      tags:
      - consent
      operationId: get__v1_consent
      responses:
        '200':
          description: Consent state
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: object
                additionalProperties: false
        '401':
          description: 'Errors: AUTH_TOKEN_EXPIRED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: *id001
    post:
      summary: Accept rules/privacy versions
      description: Accept rules/privacy versions
      tags:
      - consent
      operationId: post__v1_consent
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                additionalProperties: false
        '422':
          description: 'Errors: VALIDATION_ERROR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 'Errors: AUTH_TOKEN_EXPIRED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - versions
              properties:
                versions:
                  type: object
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Replay with the same key + payload hash returns the original response, even after the deadline
          (B4).
  /v1/event/public:
    get:
      summary: Public event metadata (cacheable 30s)
      description: Public event metadata (cacheable 30s)
      tags:
      - public
      operationId: get__v1_event_public
      responses:
        '200':
          description: Event metadata
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                      starts_at:
                        type: string
                      ends_at:
                        type: string
                      tz:
                        type: string
                      brief:
                        type: string
                      maintenance:
                        type: boolean
                additionalProperties: false
  /v1/content/event-details:
    get:
      summary: Sanitized event details markdown
      description: Sanitized event details markdown
      tags:
      - public
      operationId: get__v1_content_event_details
      responses:
        '200':
          description: Details
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: object
                    properties:
                      body_md:
                        type: string
                additionalProperties: false
  /v1/time:
    get:
      summary: Server time for offset estimation
      description: Server time for offset estimation
      tags:
      - public
      operationId: get__v1_time
      responses:
        '200':
          description: Time
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: object
                    required:
                    - server_time
                    properties:
                      server_time:
                        type: string
                        format: date-time
                      tz:
                        type: string
                additionalProperties: false
  /v1/state:
    get:
      summary: Authoritative aggregated state (state_shape_v1; ETag from version tuple)
      description: GET /state reads the version tuple, builds the response, ETag = sha256(tuple). If-None-Match
        matching → 304 with no body. server_time always fresh, excluded from the ETag body (R-09/B8).
      tags:
      - state
      operationId: get__v1_state
      responses:
        '200':
          description: Full state
          headers:
            ETag:
              schema:
                type: string
              description: Hash of the version tuple
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    $ref: '#/components/schemas/State'
                additionalProperties: false
        '304':
          description: Unchanged version tuple
        '401':
          description: 'Errors: AUTH_TOKEN_EXPIRED, AUTH_SESSION_EXPIRED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'Errors: AUTH_CONSENT_REQUIRED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '426':
          description: 'Errors: CLIENT_TOO_OLD'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 'Errors: UPSTREAM_UNAVAILABLE'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: *id001
      parameters:
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
        description: ETag from a previous response
  /v1/progress:
    get:
      summary: Node states + deadlines (progress bar)
      description: Node states + deadlines (progress bar)
      tags:
      - state
      operationId: get__v1_progress
      responses:
        '200':
          description: Progress
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: object
                    properties:
                      node_pointer:
                        type: object
                      stages:
                        type: array
                        items:
                          $ref: '#/components/schemas/StageBrief'
                additionalProperties: false
        '401':
          description: 'Errors: AUTH_TOKEN_EXPIRED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: *id001
  /v1/leaderboard:
    get:
      summary: Leaderboard snapshot (mode-aware)
      description: Leaderboard snapshot (mode-aware)
      tags:
      - state
      operationId: get__v1_leaderboard
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: object
                additionalProperties: false
        '304':
          description: Unchanged
        '401':
          description: 'Errors: AUTH_TOKEN_EXPIRED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 'Errors: MAINTENANCE'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: *id001
      parameters:
      - name: since
        in: query
        required: false
        schema:
          type: integer
        description: Version; 304 if unchanged
  /v1/team:
    get:
      summary: Team members and status
      description: Team members and status
      tags:
      - team
      operationId: get__v1_team
      responses:
        '200':
          description: Team
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: object
                additionalProperties: false
        '401':
          description: 'Errors: AUTH_TOKEN_EXPIRED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'Errors: NOT_FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: *id001
  /v1/team/score:
    get:
      summary: Team score + version
      description: Team score + version
      tags:
      - team
      operationId: get__v1_team_score
      responses:
        '200':
          description: Score
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: object
                    required:
                    - score
                    - version
                    properties:
                      score:
                        type: number
                      version:
                        type: integer
                      last_updated:
                        type: string
                        format: date-time
                additionalProperties: false
        '401':
          description: 'Errors: AUTH_TOKEN_EXPIRED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: *id001
  /v1/announcements:
    get:
      summary: Announcements (paginated)
      description: Announcements (paginated)
      tags:
      - state
      operationId: get__v1_announcements
      responses:
        '200':
          description: Announcements
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                      next_cursor:
                        type: string
                additionalProperties: false
        '401':
          description: 'Errors: AUTH_TOKEN_EXPIRED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: *id001
      parameters:
      - &id002
        name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque signed cursor
  /v1/repo/tree:
    get:
      summary: Team's repo option tree (watermarked)
      description: Team's repo option tree (watermarked)
      tags:
      - repo
      operationId: get__v1_repo_tree
      responses:
        '200':
          description: Tree
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: object
                additionalProperties: false
        '401':
          description: 'Errors: AUTH_TOKEN_EXPIRED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 'Errors: REPO_ALREADY_LOCKED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'Errors: NOT_FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: *id001
  /v1/repo/files/{path}:
    get:
      summary: Watermarked file content (no-store)
      description: 'Cache-Control: private, no-store (R-14). Watermark applied on the fly; line numbers preserved.'
      tags:
      - repo
      operationId: get__v1_repo_files_path
      responses:
        '200':
          description: File
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: object
                    properties:
                      content:
                        type: string
                      lines:
                        type: integer
                additionalProperties: false
        '401':
          description: 'Errors: AUTH_TOKEN_EXPIRED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'Errors: NOT_FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: *id001
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
  /v1/repo/search:
    get:
      summary: Server-side repo search (20/min)
      description: Server-side repo search (20/min)
      tags:
      - repo
      operationId: get__v1_repo_search
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: object
                additionalProperties: false
        '401':
          description: 'Errors: AUTH_TOKEN_EXPIRED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Errors: AUTH_RATE_LIMITED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: *id001
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          maxLength: 200
      - *id002
  /v1/team/repo-lock:
    get:
      summary: Current repo choice or null
      description: Current repo choice or null
      tags:
      - team
      operationId: get__v1_team_repo_lock
      responses:
        '200':
          description: Choice
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: object
                    properties:
                      option:
                        type: string
                        nullable: true
                additionalProperties: false
        '401':
          description: 'Errors: AUTH_TOKEN_EXPIRED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: *id001
    post:
      summary: Lock repo choice (lead only, once)
      description: Lock repo choice (lead only, once)
      tags:
      - team
      operationId: post__v1_team_repo_lock
      responses:
        '200':
          description: Locked
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: object
                additionalProperties: false
        '403':
          description: 'Errors: AUTH_FORBIDDEN'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 'Errors: REPO_ALREADY_LOCKED, IDEMPOTENCY_CONFLICT'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'Errors: VALIDATION_ERROR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - option
              - confirm
              properties:
                option:
                  type: string
                confirm:
                  type: boolean
                  enum:
                  - true
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
