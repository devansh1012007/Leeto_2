  /v1/admin/events/{id}/emergency/{action}:
    post:
      summary: Emergency action (all rails enforced)
      description: 'All rails (08 §4.12): step-up < 5 min; two distinct approvers for ledger/submission mutations;
        reason ≥ 20 chars; typed numeral confirmation; dry-run where side effects exist; pre-action snapshot; participant
        copy from catalog; 60 s auto-revert where reversible; ≤ 10/min per event. Actions: pause, resume, extend,
        freeze_writes, safe_mode, advance, freeze_participants, kill_sessions, logout_all, quarantine, score_adjust,
        snapshot, restore, publish_partial, content_push, force_refresh, drain_runner, kill_runs, state_lite, cache_reset.'
      tags:
      - admin-emergency
      operationId: post__v1_admin_events_id_emergency_action
      responses:
        '202':
          description: Action result (or dry-run preview)
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                - data
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: object
                    properties:
                      dry_run:
                        type: boolean
                      result:
                        type: object
                      undo:
                        type: object
                additionalProperties: false
        '403':
          description: 'Errors: AUTH_FORBIDDEN, AUTH_STEP_UP_REQUIRED, ESCALATION_REQUIRED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Errors: EMERGENCY_RATE_LIMITED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'Errors: VALIDATION_ERROR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 'Errors: IDEMPOTENCY_CONFLICT'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: *id003
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: action
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z_]{3,32}$
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Replay with the same key + payload hash returns the original response, even after the deadline
          (B4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              - confirm
              properties:
                reason:
                  type: string
                  minLength: 20
                confirm:
                  type: string
                  description: Typed numeral e.g. '7' (R-34)
                approver_id:
                  type: string
                  format: uuid
                dry_run:
